<style>
  html, body { margin: 0; height: 100%; background: #fff; transition: background 1s; }
  body.night { background: #000; }
  #wrap { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  canvas { width: min(calc(100vw - 32px), 900px); aspect-ratio: 600 / 150; display: block; transition: filter 1s; touch-action: none; }
  canvas.inverted { filter: invert(1); }
  /* Zona inferior: los controles y, al morir, el leaderboard ocupan el MISMO hueco (el juego no se mueve) */
  #under { position: relative; width: min(calc(100vw - 32px), 900px); min-height: 178px; margin-top: 18px; }
  #over { position: absolute; top: 0; left: 0; right: 0; display: flex; gap: 40px; flex-wrap: wrap; justify-content: center; align-items: flex-start;
          font: bold 12px 'Courier New', monospace; color: #535353; text-transform: uppercase; transition: color 1s; }
  #over[hidden], #over [hidden] { display: none !important; }
  body.night #over { color: #bbb; }
  #over .col { display: flex; flex-direction: column; gap: 9px; }
  #over .ttl { letter-spacing: 7px; }
  #board { list-style: none; margin: 0; padding: 0; columns: 2; column-gap: 28px; width: 380px; }
  #board li { display: flex; gap: 6px; padding: 1px 4px; white-space: nowrap; break-inside: avoid; }
  #board li.me { background: #535353; color: #fff; }
  body.night #board li.me { background: #bbb; color: #000; }
  #board .rk { width: 28px; text-align: right; } #board .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; }
  #over .act { min-width: 250px; align-items: flex-start; }
  #over .pts { font-size: 15px; letter-spacing: 1px; }
  #over .msg { min-height: 14px; }
  #over form { display: flex; gap: 10px; align-items: flex-end; }
  #over input { font: bold 15px 'Courier New', monospace; letter-spacing: 5px; color: inherit; background: transparent; border: 0; border-bottom: 2px solid currentColor;
                width: 150px; padding: 3px 2px; outline: none; border-radius: 0; text-transform: uppercase; }

  .kbtn { font: bold 12px 'Courier New', monospace; color: inherit; background: transparent; border: 2px solid currentColor; border-radius: 6px; padding: 6px 12px;

  .kbtn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 0 0 currentColor; }
  .kbtn:disabled { opacity: .5; cursor: default; }
  #over .again { display: flex; gap: 10px; align-items: center; }
  #over .note { font-size: 10px; opacity: .7; max-width: 380px; text-transform: none; }
  #toast { font-size: 11px; text-transform: none; max-width: 300px; min-height: 13px; }
  @media (max-width: 700px) { #board { columns: 1; width: auto; } #under { min-height: 330px; } }
  #hint { display: flex; gap: 34px; flex-wrap: wrap; justify-content: center; align-items: flex-start; margin-top: 0; padding: 0 16px; font: 12px 'Courier New', monospace; color: #535353; transition: color 1s; }

  #hint .lbl { line-height: 1.35; }
  .key { display: inline-flex; align-items: center; justify-content: center; min-width: 34px; height: 34px; box-sizing: border-box; padding: 0 10px; border: 2px solid currentColor; border-radius: 6px; font: bold 14px 'Courier New', monospace; box-shadow: 0 3px 0 currentColor; transition: transform .05s, box-shadow .05s, background .05s; user-select: none; }
  .key.wide { min-width: 120px; }
  .key.on { transform: translateY(3px); box-shadow: 0 0 0 currentColor; background: #535353; color: #fff; }
  body.night .key.on { background: #bbb; color: #000; }
  .arrows { display: grid; grid-template-columns: repeat(3, 34px); grid-template-areas: ". up ." "left down right"; gap: 5px; }
  .arrows [data-k=ArrowUp] { grid-area: up; } .arrows [data-k=ArrowLeft] { grid-area: left; } .arrows [data-k=ArrowDown] { grid-area: down; } .arrows [data-k=ArrowRight] { grid-area: right; }
  .arrows .key { min-width: 34px; padding: 0; }

<div id="wrap">

      <div class="lbl"><b>PIRUETAS (en el aire)</b><br>←︎ →︎ flips · ↑︎ ↓︎ barrel roll<br>↑︎ también salta</div></div>

<script>
(() => {
'use strict';

/* ===== Config (valores del runner original de Chromium) ===== */
const W = 600, H = 150, FPS = 60, MS_PER_FRAME = 1000 / FPS;
const CFG = {
  ACCELERATION: 0.001, BG_CLOUD_SPEED: 0.2, BOTTOM_PAD: 10, CLEAR_TIME: 3000,
  CLOUD_FREQUENCY: 0.5, GAMEOVER_CLEAR_TIME: 750, GAP_COEFFICIENT: 0.6, MAX_CLOUDS: 6,
  MAX_OBSTACLE_LENGTH: 3, MAX_OBSTACLE_DUPLICATION: 2, MAX_SPEED: 13, SPEED: 6,
  INVERT_DISTANCE: 700, INVERT_FADE_DURATION: 12000,
  GRAVITY: 0.6, INITIAL_JUMP_VELOCITY: -10, MIN_JUMP_HEIGHT: 30, MAX_JUMP_HEIGHT: 30,

  // Propulsión (nuevo)
  THRUST_ACCEL: 1.1, THRUST_MAX_UP: -3.5, FUEL_FRAMES: 100, CEILING: 4,
};
const CAR_W = 72, CAR_H = 19;
const GROUND_Y = H - CAR_H - CFG.BOTTOM_PAD; // 113
const COLOR = '#535353';

const OBSTACLES = {

    boxes: [[2,0,34,50]] },

/* ===== Canvas ===== */
const canvas = document.getElementById('c');
let ctx = canvas.getContext('2d');
function resize() {
  const k = canvas.clientWidth / W * (window.devicePixelRatio || 1);
  canvas.width = Math.round(W * k); canvas.height = Math.round(H * k);
  ctx.setTransform(k, 0, 0, k, 0, 0); ctx.imageSmoothingEnabled = false;
}
window.addEventListener('resize', resize);
resize();

/* ===== Audio ===== */
let actx = null;
function tone(freq, dur, type = 'square', vol = 0.06, slideTo = null, delay = 0) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const t = actx.currentTime + delay, o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + dur);
  } catch (e) {}
}
const sfx = {
  jump: () => tone(400, 0.16, 'square', 0.05, 800),
  point: () => { tone(880, 0.08, 'square', 0.05); tone(1320, 0.1, 'square', 0.05, null, 0.09); },
  hit: () => { tone(220, 0.35, 'sawtooth', 0.08, 40); },
  whoosh: () => tone(180, 0.7, 'sawtooth', 0.04, 1100),
  boom: () => {
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      const len = actx.sampleRate * 0.9, buf = actx.createBuffer(1, len, actx.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2);
      const src = actx.createBufferSource(); src.buffer = buf;
      const lp = actx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 900;
      const g = actx.createGain(); g.gain.value = 0.5;
      src.connect(lp); lp.connect(g); g.connect(actx.destination); src.start();
    } catch (e) {}
    tone(120, 0.5, 'sawtooth', 0.08, 30);
  },
};
let hiss = null;
function thrustSound(on) {
  try {
    if (on && !hiss) {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      const len = actx.sampleRate * 2, buf = actx.createBuffer(1, len, actx.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      const src = actx.createBufferSource(); src.buffer = buf; src.loop = true;
      const bp = actx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 2200; bp.Q.value = 0.5;
      const hp = actx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 700;
      const g = actx.createGain(); g.gain.setValueAtTime(0.0001, actx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.16, actx.currentTime + 0.08);
      src.connect(bp); bp.connect(hp); hp.connect(g); g.connect(actx.destination); src.start();
      hiss = { src, g };
    } else if (!on && hiss) {
      const h = hiss; hiss = null; const t = actx.currentTime;
      h.g.gain.cancelScheduledValues(t); h.g.gain.setValueAtTime(Math.max(h.g.gain.value, 0.0001), t);
      h.g.gain.exponentialRampToValueAtTime(0.0001, t + 0.18); h.src.stop(t + 0.2);
    }
  } catch (e) {}
}

/* ===== Dibujo de sprites ===== */
function poly(pts) { ctx.beginPath(); pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.closePath(); }

function drawWheel(cx, cy, angle, r = 6) {
  ctx.fillStyle = COLOR; ctx.beginPath(); ctx.arc(cx, cy, r, 0, 7); ctx.fill();
  ctx.globalCompositeOperation = 'destination-out';
  ctx.beginPath(); ctx.arc(cx, cy, r - 1.7, 0, 7); ctx.fill();
  ctx.globalCompositeOperation = 'source-over';
  ctx.strokeStyle = COLOR; ctx.lineWidth = 1.25;
  for (let i = 0; i < 6; i++) {
    const a = angle + i * Math.PI / 3;
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(a) * (r - 1.7), cy + Math.sin(a) * (r - 1.7)); ctx.stroke();
  }
  ctx.fillStyle = COLOR; ctx.beginPath(); ctx.arc(cx, cy, 1, 0, 7); ctx.fill();
}

// Tesla Roadster 2026: silueta tomada del render de perfil (cuña baja, nariz afilada, cabina larga y cristal continuo), 72x19.
// Los puntos están en coordenadas de la imagen (coche mirando a la izquierda) y se convierten al sprite (mirando a la derecha).
const RK = 72 / 1445;
const RP = (x, y) => [(1525 - x) * RK, (y - 245) * RK];
const RPS = pts => pts.map(q => RP(q[0], q[1]));
const ROAD_BODY = RPS([[85,488],[160,452],[250,418],[350,390],[430,368],[702,264],[762,252],[985,248],[1100,264],[1250,291],
                       [1405,316],[1465,322],[1525,345],[1523,430],[1505,505],[1510,570],[480,578],[250,578],[100,570],[92,540]]);
const ROAD_GLASS = RPS([[440,372],[708,282],[768,270],[985,268],[1100,284],[1250,308],[1385,329],[950,349]]);   // cristal con marco de techo
const ROAD_WHEELS = [RP(360, 510), RP(1292, 512)];
function seg(a, b) { ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke(); }

// Convierte un dibujo vectorial en un sprite de píxeles duros (sin antialiasing) del color del juego
const SPRITES = {};
function pixelSprite(key, w, h, draw) {
  if (SPRITES[key]) return SPRITES[key];
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'), real = ctx; ctx = g;
  try { draw(); } finally { ctx = real; }
  const im = g.getImageData(0, 0, w, h), d = im.data;
  for (let i = 0; i < d.length; i += 4) { const on = d[i + 3] >= 115; d[i] = 83; d[i + 1] = 83; d[i + 2] = 83; d[i + 3] = on ? 255 : 0; }
  g.putImageData(im, 0, 0);
  return SPRITES[key] = c;
}

// Roadster en pixel art (de perfil, mirando a la derecha): cuña baja, techo/cristal largo, nariz afilada. 72x19
const ROAD_ROWS = [   // tramos rellenos [desde, hasta] por fila
  [[27,38]],
  [[22,42]],
  [[14,23],[30,31],[42,45]],
  [[7,17],[30,31],[46,49]],

const WHEELS = [[13, 13], [58, 13]];
function roadBodySprite(o) {
  const key = 'road' + (o.crashed ? 1 : 0) + (o.blink ? 1 : 0);
  if (SPRITES[key]) return SPRITES[key];
  const c = document.createElement('canvas'); c.width = CAR_W; c.height = CAR_H; const g = c.getContext('2d');
  g.fillStyle = COLOR;
  ROAD_ROWS.forEach((spans, y) => spans.forEach(sp => g.fillRect(sp[0], y, sp[1] - sp[0] + 1, 1)));
  g.globalCompositeOperation = 'destination-out';
  WHEELS.forEach(w => { for (let y = 0; y < CAR_H; y++) for (let x = 0; x < CAR_W; x++) if (Math.hypot(x + 0.5 - w[0], y + 0.5 - w[1]) < 7.6) g.fillRect(x, y, 1, 1); });   // arcos de rueda
  [[37,6],[37,7],[37,8],[37,9],[37,10],[37,11],[37,12],[37,13],      // línea de la puerta
   [46,11],[47,11],[48,11],                                          // toma lateral
   [0,7],[0,8],                                                      // piloto trasero
   [22,10],[23,10],[24,11],[25,11],[26,11],[27,12]                  // pliegue lateral
  ].forEach(q => g.fillRect(q[0], q[1], 1, 1));
  if (o.crashed) [[40,8],[44,8],[41,9],[43,9],[42,10],[41,11],[43,11],[40,12],[44,12]].forEach(q => g.fillRect(q[0], q[1], 1, 1));   // X
  else if (!o.blink) [[64,11],[65,11],[66,11],[67,11],[68,11]].forEach(q => g.fillRect(q[0], q[1], 1, 1));                              // faro
  return SPRITES[key] = c;
}
function wheelFrame(i) { return pixelSprite('wheel' + i, 13, 13, () => drawWheel(6.5, 6.5, i * Math.PI / 12, 6.3)); }

function drawCar(x, y, o) {
  const bx = Math.round(x), by = Math.round(y) + (o.bob ? 1 : 0), seg6 = Math.PI / 3;
  ctx.drawImage(roadBodySprite(o), bx, by);
  const fi = Math.floor((((o.wheel % seg6) + seg6) % seg6) / seg6 * 4) % 4;
  WHEELS.forEach(w => ctx.drawImage(wheelFrame(fi), bx + Math.round(w[0] - 6.5), by + Math.round(w[1] - 6.5)));
}

// ---- Vehículos vistos de frente: pixel art en un solo tono, como los sprites del juego original ----

// Rotación con objetivo: un toque = una vuelta completa; mantener = vueltas seguidas;

    else if (Math.abs(c[T] - c[ax]) <= step) c[T] += dirIn * TWO_PI;                         // mantenida: otra vuelta
  }

function landTricks() {
  const c = S.car;
  const flips = Math.floor(Math.abs(c.thAcc) / FULL_TURN), rolls = Math.floor(Math.abs(c.phAcc) / FULL_TURN), n = flips + rolls;
  if (n > 0) {
    const pts = 100 * n + 50 * n * (n - 1), parts = [];
    if (flips) parts.push((flips > 1 ? flips + 'x ' : '') + (c.thAcc < 0 ? 'BACKFLIP' : 'FRONTFLIP'));
    if (rolls) parts.push((rolls > 1 ? rolls + 'x ' : '') + 'BARREL ROLL');
    S.bonus += pts; S.popups.push({ text: parts.join(' + ') + '  +' + pts, age: 0 }); sfx.point();
  }
  c.th = c.ph = c.thAcc = c.phAcc = 0; c.thT = c.phT = null;
}

function updateCar(dt) {

  if (!S.activated && c.blinkT > 500) { c.blinkT = 0; c.blink = !c.blink; }
  c.wheel += active ? S.speed * 0.12 * f : 0;
  if (S.phase === 'ramp' || c.exploded) { c.thrusting = false; thrustSound(false); return; }
  if (c.jumping) {
    if (active) {
      // piruetas: ←/→ giran en pantalla (antihorario/horario); ↑/↓ hacen barrel roll
      const lr = ((S.keys.right ? 1 : 0) - (S.keys.left ? 1 : 0)) || S.rotReq.lr;
      const ud = ((S.keys.up && !S.upLock ? 1 : 0) - (S.keys.down ? 1 : 0)) || S.rotReq.ud;
      c.thAcc += rotStep(c, 'th', lr * S.sx * S.sy, f);
      c.phAcc += rotStep(c, 'ph', ud, f);

    const hover = active && S.keyHeld && c.fuel > 0 && c.vel > -1 && !rotating;   // propulsión mantenida (gasta combustible)
    const lift = active && c.vel < 0 && !rotating;                                  // impulso del despegue: el salto sale de los propulsores
    c.thrusting = hover || lift;

      c.fuel = Math.max(0, c.fuel - f / CFG.FUEL_FRAMES);

    c.vel += CFG.GRAVITY * f;

      }

}

function pickGap(w, speed, type) {
  const minGap = Math.round((w * speed + OBSTACLES[type].minGap * CFG.GAP_COEFFICIENT) * (S.rampsDone ? 1 : 1.3));   // huecos más amplios al principio
  return Math.floor(minGap + Math.random() * (minGap * 1.5 - minGap + 1));
}
function addObstacle() {

    !(easy && (k === 'TRAFFIC_JAM' || k === 'SEMI_TALL') && actualDistance() < 110));
  const wt = k => (OBSTACLES[k].weight || 1) * (easy && (k === 'TRAFFIC_JAM' || k === 'SEMI_TALL' || k === 'SEMI') ? 0.4 : 1);

    for (const k of keys) { r -= wt(k); if (r <= 0) return k; }
    return keys[0];
  };

  const h = S.obstacleHistory;
  if (h.length >= CFG.MAX_OBSTACLE_DUPLICATION && h.slice(0, CFG.MAX_OBSTACLE_DUPLICATION).every(t => t === type) && keys.length > 1) {
    while (type === h[0]) type = pick();
  }
  if (type === 'TRAFFIC_JAM') {
    const items = []; let cx = 0;
    const n = 6 + Math.floor(Math.random() * 4);
    for (let i = 0; i < n; i++) {
      const kind = ['M3', 'MY', 'CT', 'CC', 'SEMI'][Math.floor(Math.random() * 5)];
      items.push({ kind, x: cx }); cx += OBSTACLES[kind].w + 2 + Math.floor(Math.random() * 3);
    }

  if (t.multipleSpeed > S.speed) size = 1;
  if (easy) size = Math.min(size, 2);
  const width = t.w * size;
  const y = Array.isArray(t.y) ? t.y[Math.floor(Math.random() * t.y.length)] : t.y;
  const o = { type, size, x: W, y, width, gap: pickGap(width, S.speed, type), frame: 0, frameT: 0, off: 0 };

// cajas de colisión del coche (rotado: aproximadas con una caja envolvente)
function carBoxes() {
  const c = S.car;
  if (Math.abs(Math.sin(c.th)) < 0.25 && Math.cos(c.th) * Math.cos(c.ph) > 0.7) return CAR_BOXES;
  const cs = Math.abs(Math.cos(c.th)), sn = Math.abs(Math.sin(c.th));
  const bw = (cs * CAR_W + sn * CAR_H) * 0.8, bh = (sn * CAR_W + cs * CAR_H) * 0.8;
  return [[CAR_W / 2 - bw / 2, CAR_H / 2 - bh / 2, bw, bh]];
}
function obstacleBoxes(o) {
  if (o.items) return o.items.flatMap(it => { const t = OBSTACLES[it.kind]; return t.boxes.map(b => [o.x + it.x + b[0], t.y + b[1], b[2], b[3]]); });

    for (const ob of boxes) {
      const bx = ob[0] + 1, by = ob[1] + 1, bw = ob[2] - 2, bh = ob[3] - 2;

const ease = u => u * u * (3 - 2 * u);
function startRamp() {
  const c = S.car;
  S.phase = 'ramp'; S.ramp = { t: 0, x0: c.x + CAR_W / 2 }; S.obstacles = []; S.clouds = [];
  c.jumping = false; c.vel = 0; c.thrusting = false; c.th = c.ph = c.thAcc = c.phAcc = 0; c.thT = c.phT = null; c.fuel = 1; c.y = GROUND_Y;

function rampPose() {

  if (t < P0 + P1) {
    const a = Math.PI * (t - P0) / P1;
    const fx = RAMP_CX + RAMP_RX * Math.sin(a), fy = RAMP_CYC + RAMP_RY * Math.cos(a);
    const dx = RAMP_RX * Math.cos(a), dy = -RAMP_RY * Math.sin(a), len = Math.hypot(dx, dy) || 1, hx = dx / len, hy = dy / len;

  const q = rampPose(), c = S.car;

  Object.assign(c, { x: W - q.x - CAR_W / 2, y: CEIL_Y, vel: -5, noCap: true, jumping: true, reachedMin: true,

}

function update(dt) {
  S.time += dt;
  updateCar(dt);
  const fr = dt / MS_PER_FRAME, GROUND_LINE = H - 10;
  // zoom out temporal en la rampa y en la caída: el suelo siempre queda visible abajo para saber cuándo girar
  const wantZoom = (S.phase === 'ramp' && S.ramp && S.ramp.t > P0 * 0.7) || S.car.noCap ? ZOOM_OUT : 1;
  S.zoom += (wantZoom - S.zoom) * Math.min(1, 0.12 * fr);
  S.smoke.forEach(p => {
    p.age += dt;
    p.x += p.vx * fr; p.y += p.vy * fr;
    if (!p.ground) {
      p.r += 0.045 * fr; p.vx *= 0.995;
      if (p.y >= GROUND_LINE) { p.ground = true; p.y = GROUND_LINE; p.vy = 0; p.vx = (Math.random() < 0.5 ? -1 : 1) * (0.6 + Math.random() * 1.6); p.r = Math.max(p.r, 3.2); }
    } else { p.r += 0.1 * fr; p.vx *= 0.97; p.y -= 0.12 * fr; }
    if (S.playing && !S.crashed) p.x -= S.speed * (p.ground ? 1 : 0.1) * fr;
  });
  S.smoke = S.smoke.filter(p => p.age < p.life);
  S.boom.forEach(p => { p.age += dt; if (!p.ring) { p.x += p.vx * fr; p.y += p.vy * fr; p.vy += 0.15 * fr; p.vx *= 0.99; } });
  S.boom = S.boom.filter(p => p.age < p.life);
  S.popups.forEach(p => p.age += dt); S.popups = S.popups.filter(p => p.age < 1600);

  if (!S.playing || S.crashed) return;
  S.runningTime += dt; S.zoneTime += dt; if (S.grace > 0) S.grace -= dt;
  const hasObstacles = S.runningTime > CFG.CLEAR_TIME;
  const inc = Math.floor(S.speed * (FPS / 1000) * dt);

  // suelo
  S.groundX[0] -= inc; S.groundX[1] -= inc;
  for (let i = 0; i < 2; i++) if (S.groundX[i] <= -1200) S.groundX[i] += 2400;

  // nubes
  S.cloudTimer += dt;
  S.clouds.forEach(cl => cl.x -= CFG.BG_CLOUD_SPEED * dt * FPS / 1000 * S.speed);
  S.clouds = S.clouds.filter(cl => cl.x + 46 > 0);
  const last = S.clouds[S.clouds.length - 1];
  if (S.clouds.length < CFG.MAX_CLOUDS && (!last || (W - last.x > last.gap)) && CFG.CLOUD_FREQUENCY > Math.random())

  if (S.phase === 'ramp') updateRamp(dt);

      S.obstacles = S.obstacles.filter(o => o.x + o.width > 0);
      const l = S.obstacles[S.obstacles.length - 1];
      if (S.grace <= 0 && !S.noSpawn && (!l || (l.x + l.width + l.gap < W))) addObstacle();
      if (S.phase === 'ground' && S.obstacles[0] && collides(S.obstacles[0])) return gameOver();
    }
  }

  S.distance += S.speed * dt / MS_PER_FRAME;
  if (S.speed < CFG.MAX_SPEED) S.speed += CFG.ACCELERATION * (S.rampsDone ? 1 : 0.5);   // más suave hasta la 1ª rampa

  // puntuación / flash / noche
  const sc = score(), d = actualDistance();
  if (sc > 0 && Math.floor(sc / 100) > S.lastScoreSound) {
    S.lastScoreSound = Math.floor(sc / 100); sfx.point(); S.flash = { on: true, timer: 0, iter: 0 };
  }
  if (S.flash.on) {
    S.flash.timer += dt;
    if (S.flash.timer > 1000 / 4 * 2) { S.flash.timer = 0; S.flash.iter++; if (S.flash.iter >= 3) S.flash.on = false; }
  }
  const bucket = Math.floor(d / CFG.INVERT_DISTANCE);
  if (bucket > S.lastInvertBucket) { S.lastInvertBucket = bucket; setInverted(!S.inverted); }
  else if (S.inverted) { S.invertTimer += dt; if (S.invertTimer > CFG.INVERT_FADE_DURATION) setInverted(false); }
}

function gameOver(boom) {
  if (!boom) sfx.hit();
  S.crashed = true; S.playing = false; S.car.crashed = true; S.car.thrusting = false; thrustSound(false);
  S.crashedAt = S.time;
  setTimeout(() => { if (S.crashed) showOver(); }, CFG.GAMEOVER_CLEAR_TIME);
  const sc = score();
  if (sc > hiScore) { hiScore = sc; try { localStorage.setItem('teslaRunnerHi', hiScore); } catch (e) {} }
}

/* ===== Render ===== */
function pad(n) { return String(Math.min(n, 99999)).padStart(5, '0'); }

function drawRampTrack() {
  const r = S.ramp; if (!r) return;
  const k = P0 * 0.55, slide = r.t < k ? (1 - ease(r.t / k)) * 240 : 0;   // la rampa entra desde la derecha
  ctx.save(); ctx.translate(slide, 0);
  ctx.strokeStyle = COLOR; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.ellipse(RAMP_CX, RAMP_CYC, RAMP_RX + 1.5, RAMP_RY + 1.5, 0, Math.PI / 2, -Math.PI / 2, true); ctx.stroke();
  ctx.fillStyle = COLOR; ctx.fillRect(RAMP_CX - RUN_LEN - 10, CEIL_Y - 3, RUN_LEN + 10, 3);   // viga del techo
  ctx.lineWidth = 1;
  for (let a = 0.1; a < Math.PI; a += 0.1) {                                                     // costillas exteriores
    const px = RAMP_CX + Math.sin(a) * (RAMP_RX + 3.5), py = RAMP_CYC + Math.cos(a) * (RAMP_RY + 3.5);
    const nx = Math.sin(a) / RAMP_RX, ny = Math.cos(a) / RAMP_RY, nl = Math.hypot(nx, ny);
    ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px + nx / nl * 4, py + ny / nl * 4); ctx.stroke();
  }
  for (let x = RAMP_CX - RUN_LEN; x < RAMP_CX; x += 14) { ctx.beginPath(); ctx.moveTo(x, CEIL_Y - 3); ctx.lineTo(x - 4, CEIL_Y - 8); ctx.stroke(); }
  ctx.restore();
}

function render() {
  ctx.clearRect(0, 0, W, H);
  ctx.save();
  ctx.translate(W, H); ctx.scale(S.zoom, S.zoom); ctx.translate(-W, -H);   // zoom anclado abajo a la derecha de la PANTALLA
  ctx.imageSmoothingEnabled = S.zoom < 0.98;                              // con zoom out, suavizado para que el coche siga viéndose
  ctx.translate(S.sx < 0 ? W : 0, 0); ctx.scale(S.sx, 1);                  // espejo (se alterna tras cada rampa)
  // luna y estrellas (se ven invertidas en modo noche)
  if (S.inverted) {
    ctx.fillStyle = COLOR;
    ctx.beginPath(); ctx.arc(500 - (S.distance * 0.02 % 700), 40, 10, 0, 7); ctx.fill();
    ctx.globalCompositeOperation = 'destination-out'; ctx.beginPath(); ctx.arc(505 - (S.distance * 0.02 % 700), 37, 9, 0, 7); ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = COLOR;
    [[60,30],[210,55],[370,22],[480,60]].forEach(([sx, sy]) => { ctx.fillRect(sx, sy, 2, 2); ctx.fillRect(sx - 1, sy + 0.5, 4, 1); });
  }
  S.clouds.forEach(cl => drawCloud(cl.x, cl.y));
  // suelo
  for (let i = 0; i < 2; i++) ctx.drawImage(groundTex, 0, 0, 1200, 12, S.groundX[i], H - 11, 1200, 12);
  ctx.drawImage(groundTex, 0, 0, 1200, 12, Math.min(S.groundX[0], S.groundX[1]) - 1200, H - 11, 1200, 12);
  ctx.drawImage(groundTex, 0, 0, 1200, 12, Math.max(S.groundX[0], S.groundX[1]) + 1200, H - 11, 1200, 12);
  // obstáculos
  S.obstacles.forEach(o => {
    if (o.items) o.items.forEach(it => drawVehicle(o.x + it.x, OBSTACLES[it.kind].y, it.kind));
    else if (o.type === 'ROCKET') drawRocket(o.x, o.y, o.frame);
    else drawVehicle(o.x, o.y, o.type, o.size);
  });
  if (S.phase === 'ramp') drawRampTrack();
  // gas de los propulsores
  ctx.fillStyle = COLOR;
  S.smoke.forEach(p => {
    const t = p.age / p.life;
    ctx.globalAlpha = Math.max(0, (p.ground ? 0.5 : 0.65) * (1 - t * t));
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill();
  });
  ctx.globalAlpha = 1;
  // coche
  const c = S.car;
  const opts = { bob: c.jumping || !S.playing ? false : c.bob, wheel: c.wheel, thrust: c.thrusting, crashed: c.crashed, blink: c.blink };
  if (c.exploded) { /* hecho pedazos */ }
  else if (S.phase === 'ramp' && S.ramp) {
    const q = rampPose();
    ctx.save(); ctx.translate(q.x, q.y); ctx.rotate(q.rot);
    drawCar(-CAR_W / 2, -CAR_H / 2, { ...opts, bob: false }); ctx.restore();
  } else if (c.th || c.ph) {
    const s = Math.cos(c.ph);
    ctx.save(); ctx.translate(c.x + CAR_W / 2, c.y + CAR_H / 2); ctx.rotate(c.th);
    ctx.scale(1, Math.abs(s) < 0.06 ? (s < 0 ? -0.06 : 0.06) : s);
    drawCar(-CAR_W / 2, -CAR_H / 2, { ...opts, bob: false }); ctx.restore();
  } else drawCar(c.x, c.y, opts);
  // explosión
  S.boom.forEach(p => {
    if (p.age < 0) return;
    const t = p.age / p.life;
    if (p.ring) {
      ctx.globalAlpha = Math.max(0, 0.8 * (1 - t)); ctx.strokeStyle = COLOR; ctx.lineWidth = 2 * (1 - t) + 0.5;
      ctx.beginPath(); ctx.arc(p.x, p.y, 4 + t * 55, 0, 7); ctx.stroke();
    } else {
      ctx.globalAlpha = Math.max(0, 1 - t * t); ctx.fillStyle = COLOR; ctx.fillRect(p.x, p.y, p.s, p.s);
    }
  });
  ctx.globalAlpha = 1;
  // barra de combustible
  if (c.jumping && c.fuel < 1 && !c.exploded) {
    ctx.strokeStyle = COLOR; ctx.lineWidth = 1; ctx.strokeRect(c.x + 12.5, Math.max(c.y - 8, 1) + 0.5, 40, 3);
    ctx.fillStyle = COLOR; ctx.fillRect(c.x + 14, Math.max(c.y - 8, 1) + 2, 37 * c.fuel, 1);
  }
  ctx.restore();

  // puntuación
  ctx.font = "bold 13px 'Courier New', monospace"; ctx.textBaseline = 'top'; ctx.fillStyle = COLOR;
  const hudY = 5;
  if (hiScore > 0) { ctx.fillStyle = '#757575'; ctx.fillText('HI ' + pad(hiScore), W - 150, hudY); }
  ctx.fillStyle = COLOR;
  if (!S.flash.on || Math.floor(S.flash.timer / 125) % 2 === 1) ctx.fillText(pad(score()), W - 60, hudY);
  // aviso de truco
  const pp = S.crashed ? null : S.popups[S.popups.length - 1];
  if (pp) {
    ctx.globalAlpha = Math.max(0, Math.min(1, (1600 - pp.age) / 500)); ctx.textAlign = 'center'; ctx.fillStyle = COLOR;
    ctx.fillText(pp.text, W / 2, 56 - Math.min(pp.age, 400) * 0.02); ctx.textAlign = 'left'; ctx.globalAlpha = 1;
  }
  // game over
  if (S.crashed) {
    ctx.fillStyle = COLOR; ctx.textAlign = 'center';
    ctx.font = "bold 14px 'Courier New', monospace";
    ctx.fillText('G A M E   O V E R', W / 2, 40);
    ctx.strokeStyle = COLOR; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(W / 2, 80, 11, -Math.PI * 0.35, Math.PI * 1.5); ctx.stroke();
    ctx.fillStyle = COLOR; poly([[W / 2 + 3, 65], [W / 2 + 13, 70], [W / 2 + 4, 76]]); ctx.fill();
    ctx.textAlign = 'left';
  }
}

/* ===== Bucle ===== */
let prev = performance.now();
function loop(now) {
  const dt = Math.min(now - prev, 100); prev = now;
  update(dt); render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
if (qs.has('debug')) window.T = { update, render, S, addObstacle, startJump, press: () => press(), release: () => release(), pressUp: () => pressUp(), showOver, gameOver, skipToRamp, makeShareImage, saveScore, shareScore };

/* ===== Input ===== */
function tryRestart() {
  if (S.crashed && S.time - S.crashedAt >= CFG.GAMEOVER_CLEAR_TIME) { reset(); hideOver(); S.playing = S.activated = true; return true; }
  return false;
}
// Espacio / Enter / puntero: saltar y, mantenido en el aire, propulsar
function press() {
  if (S.crashed) { if (tryRestart()) { S.keyHeld = true; startJump(); } return; }
  S.keyHeld = true;
  if (!S.playing) S.playing = S.activated = true;
  if (S.phase !== 'ramp' && !S.car.jumping) startJump();
}
function release() { S.keyHeld = false; if (S.car.jumping) endJump(); }
// ↑: salta desde el suelo; en el aire hace barrel roll (hasta soltarla no cuenta la pulsación del salto)
function pressUp() {
  S.keys.up = true;
  if (S.playing && !S.crashed && S.car.jumping && S.phase !== 'ramp') S.rotReq.ud = 1;
  if (S.crashed) { if (tryRestart()) { S.keys.up = true; S.upLock = true; startJump(); } return; }
  if (!S.playing) S.playing = S.activated = true;
  if (S.phase !== 'ramp' && !S.car.jumping) { startJump(); S.upLock = true; }
}
// Atajo de pruebas (Intro): salta a 10 puntos antes de la siguiente rampa
function skipToRamp() {
  if (S.phase !== 'ground') return;
  if (!S.playing) S.playing = S.activated = true;
  const target = (S.zoneDist + RAMP_DIST - 10) / 0.025;
  if (S.distance < target) S.distance = target;
  S.runningTime = Math.max(S.runningTime, CFG.CLEAR_TIME + 1);
  S.popups.push({ text: 'INTRO: 10 ANTES DE LA RAMPA', age: 0 });
}
const ARROWS = { ArrowLeft: 'left', ArrowRight: 'right', ArrowDown: 'down' };
// teclas visuales: se iluminan al pulsarlas
const keyEls = c => document.querySelectorAll('.key[data-k="' + c + '"]');
document.addEventListener('keydown', e => keyEls(e.code).forEach(el => el.classList.add('on')));
document.addEventListener('keyup', e => keyEls(e.code).forEach(el => el.classList.remove('on')));
window.addEventListener('blur', () => document.querySelectorAll('.key.on').forEach(el => el.classList.remove('on')));
const typing = e => e.target && /^(INPUT|TEXTAREA|BUTTON|SELECT)$/.test(e.target.tagName);
document.addEventListener('keydown', e => {
  const overOpen = S.crashed && !$('over').hidden;
  // con el leaderboard abierto: ESPACIO vuelve a jugar siempre (guardando antes el nombre si lo has escrito)
  if (overOpen && e.code === 'Space') { e.preventDefault(); if (!e.repeat) playAgainFromOver(); return; }
  // las letras van solas al campo del nombre (sin tener que pulsar en él)
  if (overOpen && !$('nameForm').hidden && e.target !== $('nameInput') && /^[a-z0-9]$/i.test(e.key) && !e.ctrlKey && !e.metaKey && !e.altKey) { $('nameInput').focus(); return; }
  if (typing(e)) return;
  if (e.code === 'Space') { e.preventDefault(); if (!e.repeat) press(); }
  else if (e.code === 'ArrowUp') { e.preventDefault(); if (!e.repeat) pressUp(); }
  else if (ARROWS[e.code]) {
    e.preventDefault(); S.keys[ARROWS[e.code]] = true;
    if (!e.repeat && S.playing && !S.crashed && S.car.jumping && S.phase !== 'ramp') {
      if (e.code === 'ArrowLeft') S.rotReq.lr = -1; else if (e.code === 'ArrowRight') S.rotReq.lr = 1; else S.rotReq.ud = -1;
    }
  }
  else if (e.code === 'Enter') { e.preventDefault(); if (overOpen && wantsSave()) saveScore(); else if (S.crashed) press(); else if (!e.repeat) skipToRamp(); }
});
document.addEventListener('keyup', e => {
  if (typing(e) && e.code !== 'ArrowUp') return;
  if (e.code === 'Space' || e.code === 'Enter') release();
  else if (e.code === 'ArrowUp') { S.keys.up = false; S.upLock = false; }
  else if (ARROWS[e.code]) S.keys[ARROWS[e.code]] = false;
});

/* ===== Game over: leaderboard, nombre y compartir ===== */
const $ = id => document.getElementById(id);
// Leaderboard: con server.js es el mismo servidor ('/api/scores'). Si el juego está en un hosting estático (GitHub Pages...),
// pon la URL de tu API en TESLA_RUNNER_API (arriba, en el <head>) o pásala con ?api=https://mi-api.example.com
const API_BASE = (new URLSearchParams(location.search).get('api') || window.TESLA_RUNNER_API || '').replace(/\/$/, '');
const API = API_BASE ? API_BASE + '/api/scores'
  : (location.protocol.startsWith('http') && !/\.github\.io$/.test(location.hostname) ? '/api/scores' : null);
const LS_BOARD = 'teslaRunnerBoard', LS_NAME = 'teslaRunnerName';
const TOP_N = 100;
let finalScore = 0;

async function fetchBoard() {
  if (API) { try { const r = await fetch(API, { cache: 'no-store' }); if (r.ok) return { list: await r.json(), shared: true }; } catch (e) {} }
  try { return { list: JSON.parse(localStorage.getItem(LS_BOARD) || '[]'), shared: false }; } catch (e) { return { list: [], shared: false }; }
}
async function postScore(name, sc) {
  if (API) {
    try {
      const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name, score: sc }) });
      if (r.status === 403) return null;      // no entra en el TOP 100
      if (r.ok) return await r.json();
    } catch (e) {}
  }
  const entry = { name, score: sc, date: Date.now() };
  try {
    const l = JSON.parse(localStorage.getItem(LS_BOARD) || '[]'); l.push(entry);
    l.sort((a, b) => b.score - a.score || a.date - b.date); localStorage.setItem(LS_BOARD, JSON.stringify(l.slice(0, TOP_N)));
  } catch (e) {}
  return entry;
}
const sameEntry = (a, b) => a && b && a.date === b.date && a.name === b.name && a.score === b.score;
function renderBoard(list, mine) {
  const ol = $('board'); ol.textContent = '';
  const sorted = list.slice().sort((a, b) => b.score - a.score || a.date - b.date);
  const row = (e, rank) => {
    const li = document.createElement('li');
    if (sameEntry(e, mine)) li.className = 'me';
    [['rk', rank + '.'], ['nm', e.name], ['pt', pad(e.score)]].forEach(([c, t]) => { const sp = document.createElement('span'); sp.className = c; sp.textContent = t; li.appendChild(sp); });
    ol.appendChild(li);
  };
  sorted.slice(0, 10).forEach((e, i) => row(e, i + 1));
  if (!sorted.length) { const li = document.createElement('li'); li.textContent = 'Aún no hay puntuaciones'; ol.appendChild(li); }
  const idx = mine ? sorted.findIndex(e => sameEntry(e, mine)) : -1;
  if (idx >= 10) row(sorted[idx], idx + 1);
}
async function refreshBoard(mine) {
  const { list, shared } = await fetchBoard();
  renderBoard(list, mine);
  const note = $('boardNote');
  note.hidden = shared; note.textContent = shared ? '' : 'Modo local: este leaderboard solo existe en tu navegador (ver README para compartirlo).';
  return list;
}
// ¿esta puntuación entra en el TOP 100? (y en qué puesto)
function topRank(list, sc) {
  const sorted = list.slice().sort((a, b) => b.score - a.score);
  if (sc <= 0) return 0;
  if (sorted.length >= TOP_N && sc <= sorted[TOP_N - 1].score) return 0;
  return sorted.filter(e => e.score >= sc).length + 1;
}

async function showOver() {
  finalScore = score();
  $('finalScore').textContent = pad(finalScore);
  $('nameForm').hidden = true; $('saved').hidden = true; $('saveBtn').disabled = false; $('topMsg').textContent = ''; $('toast').textContent = '';
  try { $('nameInput').value = localStorage.getItem(LS_NAME) || ''; } catch (e) {}
  $('over').hidden = false; $('hint').style.visibility = 'hidden';
  const list = await refreshBoard(null);
  if (!S.crashed) return;
  const rank = topRank(list, finalScore);
  if (rank) {   // solo se pide el nombre si entra en el TOP 100; el campo NO roba el foco: escribe y las letras entran solas
    $('topMsg').textContent = '¡Puesto ' + rank + ' del TOP ' + TOP_N + '! Escribe tu nombre';
    $('nameForm').hidden = false;
  } else if (finalScore > 0) {
    const min = list.length >= TOP_N ? list.slice().sort((a, b) => b.score - a.score)[TOP_N - 1].score + 1 : 1;
    $('topMsg').textContent = 'Fuera del TOP ' + TOP_N + ' (mínimo ' + pad(min) + ')';
  }
}
function hideOver() {
  $('over').hidden = true; $('hint').style.visibility = 'visible';
  if (document.activeElement && document.activeElement !== document.body) document.activeElement.blur();
}
const wantsSave = () => !$('over').hidden && !$('nameForm').hidden && !$('saveBtn').disabled && $('nameInput').value.trim().length > 0;
async function saveScore() {
  if ($('saveBtn').disabled) return;
  const name = $('nameInput').value.replace(/[<>]/g, '').trim().slice(0, 12).toUpperCase() || 'ANÓNIMO', sc = finalScore;
  try { localStorage.setItem(LS_NAME, name); } catch (err) {}
  $('saveBtn').disabled = true;
  const entry = await postScore(name, sc);
  if (sc !== finalScore || $('over').hidden) return;       // ya empezó otra partida
  $('nameForm').hidden = true;
  if (!entry) { $('topMsg').textContent = 'Fuera del TOP ' + TOP_N; await refreshBoard(null); return; }
  $('topMsg').textContent = ''; $('saved').hidden = false; $('saved').textContent = '¡Guardado!';
  await refreshBoard(entry);
}
// Espacio con el panel abierto: guarda el nombre (si lo has escrito) y vuelve a jugar

// Imagen 1200x630 imitando la demo: el Roadster flotando sobre una fila de coches con gas frío, un Starship acercándose a lo lejos
// y la puntuación en la esquina superior derecha (como en el juego). Con sc = null no pone puntuación (imagen para la tarjeta del enlace).
function makeShareImage(sc) {
  const c = document.createElement('canvas'); c.width = 1200; c.height = 630; const g = c.getContext('2d');

  });

  WHEELS.forEach(w => g.drawImage(wheelFrame(1), Math.round(w[0] - 6.5) - CAR_W / 2, Math.round(w[1] - 6.5) - CAR_H / 2));
  g.restore();
  // Starship acercándose a lo lejos (más pequeño y más tenue)
  g.globalAlpha = 0.7; g.drawImage(rocketSprite(0), 900, 118, 52 * 3, 19 * 3); g.globalAlpha = 1;
  // textos
  g.fillStyle = COLOR; g.textBaseline = 'top';
  g.font = "bold 30px 'Courier New', monospace"; g.textAlign = 'left'; g.fillText('T E S L A   R U N N E R', 44, 40);
  if (sc != null) { g.font = "bold 54px 'Courier New', monospace"; g.textAlign = 'right'; g.fillText(pad(sc), 1156, 34); }
  return c;
}
async function shareScore() {
  const L = I18N[userLang()], sc = finalScore, text = L.text.replace('{n}', sc);
  const pageUrl = location.protocol.startsWith('http') && !/^(localhost|127\.)/.test(location.hostname) ? location.href.split('?')[0] : '';
  const btn = $('shareBtn'); btn.disabled = true;
  try {
    const blob = await new Promise(r => makeShareImage(sc).toBlob(r, 'image/png'));
    const file = new File([blob], 'tesla-runner.png', { type: 'image/png' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {          // móvil: hoja de compartir con la imagen adjunta
      try { await navigator.share({ text: text + (pageUrl ? ' ' + pageUrl : ''), files: [file] }); return; } catch (e) { if (e && e.name === 'AbortError') return; }
    }
    let copied = false;                                                          // escritorio: imagen al portapapeles + ventana de X
    try { await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]); copied = true; } catch (e) {}
    if (!copied) { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'tesla-runner.png'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); }
    $('toast').textContent = copied ? L.copied : L.saved;
    let u = 'https://x.com/intent/post?text=' + encodeURIComponent(text) + '&hashtags=TeslaRunner';
    if (pageUrl) u += '&url=' + encodeURIComponent(pageUrl);
    window.open(u, '_blank', 'noopener');
  } finally { btn.disabled = false; }
}
$('nameForm').addEventListener('submit', e => { e.preventDefault(); saveScore(); });
$('shareBtn').addEventListener('click', shareScore);
canvas.addEventListener('pointerdown', e => { e.preventDefault(); press(); });
window.addEventListener('pointerup', release);
window.addEventListener('blur', () => { release(); S.keys = {}; S.upLock = false; });
})();
