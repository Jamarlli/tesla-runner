# Plantilla para Fly.io. Cambia "app" por un nombre único y revisa con `fly launch --no-deploy`.
# Antes del primer deploy:  fly volumes create data --size 1
# Un volumen solo se puede montar en UNA máquina: no escales a varias instancias.
app = "tesla-runner"
primary_region = "mad"

[build]

[env]
  PORT = "8080"
  DATA_DIR = "/data"

[[mounts]]
  source = "data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
